name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本读 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        # pnpm 的「新发布包」年龄门（minimumReleaseAge）会拒绝发布不足 24h 的版本
        # （本仓库就被 vue@3.5.43 卡过一次）。CI 装的是已提交、已审过的 lockfile，
        # 不是刚解析出来的新版本，所以在这里显式关掉这道门。
        env:
          npm_config_minimum_release_age: '0'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # 离线套件：mock 剧本的渲染/流式/折叠 16 项 + .env 加载行为 9 项
      # live / agent 需要真实端点与 key，不进 CI，本地按 README 跑
      - name: Headless checks
        run: pnpm smoke
