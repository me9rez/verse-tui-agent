# Verse gateway 配置 —— 复制到 ~/.verse/config.toml
# Windows：%USERPROFILE%\.verse\config.toml   目录可用 VERSE_HOME 环境变量整体替换（唯一环境变量）
# 项目级覆盖：<repo>/.verse/local.toml（同 schema，深合并，已 gitignore）
# 字段名一律 snake_case；别名含 . 或 : 时表键加引号。

default_model = "wb2api/cn:hy3"    # 必须是 [models] 里的别名
default_mode  = "plan"             # plan | execute —— 新会话默认 harness 模式

[gateway]
host = "127.0.0.1"     # 改 0.0.0.0 前先想清楚安全边界
port = 8765            # TUI 连接地址固定默认 ws://127.0.0.1:8765，改端口需同步 pnpm dev -- --url
workspace = ""         # 空 → <repo>/.agent-sandbox（agent 工具工作区；不是沙箱，命令真跑）
history   = ""         # 空 → <backend>/history（每 session 一个 JSONL）
log_level = "INFO"

[providers."wb2api"]
type = "openai"                      # openai = Chat Completions | openai_responses = Responses API
base_url = "http://127.0.0.1:7863/v1"
api_key = ""                         # 明文写这里；config/get 只回 "***set***"，前端拿不到本体
# 可选：Kimi 同款 env 子表 —— api_key 为空时取第一个非空值；只读本文件，不读 shell 环境
# [providers."wb2api".env]
# WB_API_KEY = "sk-xxx"

[models."wb2api/cn:hy3"]
provider = "wb2api"
model = "cn:hy3"
max_context_size = 131072            # 上下文窗口（token）；配置即启用 harness 历史压缩（超预算先折叠工具输出再截断）
display_name = "cn:hy3"              # /model 选择器显示名，缺省回退 model
# 以下全部可选（Kimi Code 同款语义，不配 = 行为不变）：
# max_input_size = 96000             # 单次请求输入上限；压缩预算优先用它（≤ 窗口 - 输出）
# max_output_size = 16384            # 输出预留（映射 max_tokens）；缺省 16384
# capabilities = ["thinking", "image_in"]   # 能力标签（追加式）：thinking/always_thinking/image_in/video_in/audio_in/tool_use…
# support_efforts = ["low", "medium", "high", "xhigh"]  # /effort 可选档位；不配回默认 low/medium/high/xhigh
# default_effort = "high"            # 启动/切模型后的默认档位；不配则不发思考参数
# off_effort = "none"                # /effort off 时下发端点的编码（如 xai 的 "none"）；缺省发 "none"
# base_url = "http://..."            # 模型级端点覆盖（优先于 provider 的 base_url）
# reasoning_key = "reasoning_content"  # 网关用非标准字段返回推理内容时设置（openai 供应商）
# adaptive_thinking = true           # 仅 anthropic 供应商（预留，当前未消费）
# [models."wb2api/cn:hy3".overrides]  # 覆盖子表：effective 值 = 顶层被此处覆盖；
# max_context_size = 200000           # provider/model/base_url 三键不接受覆盖
